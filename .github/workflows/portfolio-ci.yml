name: Portfolio CI

on:
  push:
    branches:
      - feature/futuristic-college-portfolio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repository-wide ESLint command still has a pre-existing legacy backlog.
      # Lint the restored About room airplane and its component directly.
      - name: Lint About room airplane
        run: npx eslint src/components/canvas/rooms/About/AboutRoom.jsx src/components/canvas/rooms/About/PaperAirplane.jsx

      - name: Build production bundle
        run: npm run build
