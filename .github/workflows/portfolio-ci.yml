name: Portfolio CI

on:
  push:
    branches:
      - feature/futuristic-college-portfolio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repository-wide ESLint command currently reports 224 pre-existing
      # errors across legacy files. Keep this PR's new Flight Deck component
      # linted while the existing lint backlog is handled separately.
      - name: Lint new Flight Deck component
        run: npx eslint src/components/canvas/rooms/Flight/FlightRoom.jsx

      - name: Build production bundle
        run: npm run build
